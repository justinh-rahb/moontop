# GoReleaser v2 config. Validated in CI (`goreleaser check` + snapshot build).
# Releases are cut by .github/workflows/release.yml — see docs/RELEASING.md.
version: 2

project_name: moontop

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: moontop
    main: ./cmd/moontop
    binary: moontop
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows, freebsd]
    goarch: [amd64, arm64, arm]
    goarm: ["7"]
    ignore:
      - goos: darwin
        goarch: arm
      - goos: windows
        goarch: arm
      - goos: freebsd
        goarch: arm
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .ShortCommit }} -X main.date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: moontop
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  # Release notes come from CHANGELOG.md via --release-notes.
  disable: true

release:
  github:
    owner: justinh-rahb
    name: moontop
  prerelease: auto
